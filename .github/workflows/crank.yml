# Runs the Goldgrid draws on GitHub's machines, so no round waits for anyone's
# computer to be on. The draw is permissionless: this is one cranker, and anyone
# can run `node cli/crank.mjs` beside it.
#
# One job cranks for 5 h 45 min (inside the 6 h job limit). Each job first
# queues its own successor, which the concurrency group holds until this job
# ends, so the chain never depends on the schedule: GitHub delays or skips cron
# runs, and on a new repository it ran none for hours. A workflow_dispatch from
# the job's own token is one of the two events such a token may start. The
# hourly schedule stays as a backup that restarts a broken chain.
#
# Repository secrets: CRANK_SECRET (the fee-only crank key) and RPC_URL (a devnet
# RPC endpoint). RANDOMNESS_SECRET belonged to Switchboard and is no longer read.
name: draw-crank
run-name: draw crank
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: draw-crank
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  crank:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - run: gh workflow run crank.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: node crank.mjs --for=20700
        env:
          CRANK_SECRET: ${{ secrets.CRANK_SECRET }}
          RANDOMNESS_SECRET: ${{ secrets.RANDOMNESS_SECRET }}
          RPC_URL: ${{ secrets.RPC_URL }}
