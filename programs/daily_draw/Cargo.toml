[package]
name = "daily_draw"
version = "0.1.0"
description = "Free nightly draw for Seeker owners: pick 5 of 85, Switchboard picks the winners"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "daily_draw"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.2", default-features = false, features = ["token", "token_2022"] }
switchboard-on-demand = "0.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
